name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift build
        run: swift build
      - name: Swift tests
        run: swift test
      - name: Python syntax
        run: python3 -m compileall -q *.py mcp
      - name: Shell syntax
        run: for f in *.sh; do bash -n "$f"; done
